<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ececec">
<title>Tattoo studio</title>
<link rel="stylesheet" href="style.css?v=20260907">
<link rel="stylesheet" href="transition-fix.css?v=20260907">
</head>
<body>
<div class="page-transition" aria-hidden="true">
  <div class="transition-ring"></div>
  <div class="transition-word">Tattoo</div>
  <div class="transition-sub">studio</div>
  <div class="transition-line"></div>
</div>
<main class="tattoo-page" id="top" aria-label="Tattoo studio">
  <nav class="access-nav" aria-label="Навигация по сайту">
    <a href="#services">Услуги</a><a href="#process">Процесс</a><a href="#works">Работы</a><a href="#sketches">Эскизы</a><a href="#contacts">Контакты</a>
  </nav>
  <section class="page-section hero" id="home" aria-label="Главная"><a class="hotspot services-link" href="#services" aria-label="Перейти к услугам"></a></section>
  <section class="page-section memory" id="services" aria-label="Услуги"><a class="hotspot process-link" href="#process" aria-label="Перейти к процессу"></a></section>
  <section class="page-section process" id="process" aria-label="Процесс"><a class="hotspot works-link" href="#works" aria-label="Перейти к работам"></a></section>
  <section class="page-section works" id="works" aria-label="Примеры работ"><a class="hotspot sketches-link" href="#sketches" aria-label="Перейти к эскизам"></a></section>
  <section class="page-section sketches" id="sketches" aria-label="Эскизы"><a class="hotspot contacts-link" href="#contacts" aria-label="Открыть контакты"></a></section>
  <footer class="page-section contacts" id="contacts" aria-label="Контакты">
    <a class="contact-phone" href="tel:+79284854020" aria-label="Позвонить"></a>
    <a class="contact-mail" href="mailto:qqmill@cloud.com" aria-label="Написать на почту"></a>
  </footer>
</main>

<section class="contact-screen" id="contact-screen" aria-hidden="true">
  <button class="contact-close" type="button" aria-label="Вернуться назад">← НАЗАД</button>
  <div class="contact-screen-inner">
    <div class="contact-screen-copy">
      <span class="contact-kicker">05 / GET IN TOUCH</span>
      <h1>Свяжитесь<br><i>со мной.</i></h1>
      <p>Расскажите идею татуировки, а я помогу превратить её в эскиз.</p>
      <div class="contact-direct">
        <a href="tel:+79284854020">+7 928 485 40 20</a>
        <a href="mailto:qqmill@cloud.com">qqmill@cloud.com</a>
      </div>
    </div>
    <form class="tattoo-form" action="#" method="post">
      <label>ИМЯ / НИКНЕЙМ<input name="name" type="text" placeholder="Ваше имя или @username" autocomplete="name" required></label>
      <label>ПОЧТА / TELEGRAM<input name="contact" type="text" placeholder="email@example.com / @username" required></label>
      <label>ВАША ИДЕЯ<textarea name="idea" placeholder="Расскажите о татуировке: идея, размер, место на теле..." required></textarea></label>
      <button type="submit">ОТПРАВИТЬ ЗАПРОС <span>↗</span></button>
    </form>
  </div>
</section>
<script src="script.js?v=20260907"></script>
</body>
</html>
